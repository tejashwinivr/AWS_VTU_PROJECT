<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.login-box{
    width:400px;
    background:rgba(255,255,255,0.12);
    padding:40px;
    border-radius:20px;
    text-align:center;
    backdrop-filter:blur(10px);
}

.login-box h1{
    color:white;
    margin-bottom:10px;
}

.login-box p{
    color:white;
    opacity:0.8;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#ff7eb3,#ff758c);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

</style>
</head>

<body>

<div class="login-box">

    <h1>☁️ DAMS Login</h1>

    <p>Digital Asset Management System</p>

    <form action="/login" method="post">

        <input 
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input 
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">

            Login

        </button>

    </form>

</div>

</body>
</html>
