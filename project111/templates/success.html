<!DOCTYPE html>
<html>
<head>
<title>Success</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}

body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
}

/* Card */
.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding:40px;
    border-radius:15px;
    text-align:center;
    width:400px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* Success icon */
.icon {
    font-size:60px;
    margin-bottom:15px;
    animation: pop 0.6s ease;
}

@keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}

h2 {
    margin-bottom:10px;
}

.file-name {
    margin:15px 0;
    font-size:14px;
    opacity:0.9;
}

/* Buttons */
.btn {
    display:inline-block;
    margin:10px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#ff7eb3,#ff758c);
}

.btn:hover {
    transform: scale(1.05);
}

/* Image preview */
.preview img {
    width:120px;
    margin-top:15px;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="container">

    <div class="icon">✅</div>

    <h2>Upload Successful!</h2>

    <div class="file-name">
        File: {{ filename }}
    </div>

    <!-- Optional preview -->
    <div class="preview">
        {% if filename.endswith('.png') or filename.endswith('.jpg') or filename.endswith('.jpeg') %}
        <img src="https://{{ bucket_name }}.s3.amazonaws.com/{{ filename }}">
        {% endif %}
    </div>

    <br>

    <a href="/upload-page" class="btn">Upload Another</a>
    <a href="/" class="btn">🏠 Home</a>

</div>

</body>
</html>
