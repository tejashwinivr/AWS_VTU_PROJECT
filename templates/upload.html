
<!DOCTYPE html>
<html>
<head>
<title>Upload</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}

body {
    margin:0;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

/* Container */
.container {
    max-width:700px;
    margin:60px auto;
    text-align:center;
}

/* Upload section */
.upload-section {
    background: rgba(255,255,255,0.12);
    padding:40px;
    border-radius:15px;
}

/* Drag box */
.upload-box {
    border:2px dashed rgba(255,255,255,0.6);
    padding:80px 30px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
    margin-bottom:30px;
}

.upload-box:hover {
    background: rgba(255,255,255,0.15);
}

input[type="file"] {
    display:none;
}

/* Preview */
#preview img {
    width:120px;
    margin-top:15px;
    border-radius:10px;
}

#preview p {
    margin-top:10px;
}

/* Upload button */
.upload-btn {
    display:block;
    margin:0 auto;
    padding:12px 30px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#ff7eb3,#ff758c);
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* Progress */
.progress {
    width:100%;
    height:8px;
    background:#ddd;
    margin-top:25px;
    border-radius:5px;
    overflow:hidden;
    display:none;
}

.progress-bar {
    height:100%;
    width:0%;
    background:#00ffcc;
}

/* File list */
.files {
    margin-top:40px;
    text-align:left;
}

.file-card {
    background: rgba(255,255,255,0.15);
    padding:12px;
    margin-top:12px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
}

.file-card a {
    color:#00ffff;
}
</style>

</head>

<body>

<div class="container">

    <h2>☁️ Cloud File Upload</h2>

    <div class="upload-section">

        <form action="/upload" method="post" enctype="multipart/form-data" onsubmit="startProgress()">

            <!-- DRAG BOX ONLY -->
            <div class="upload-box" id="uploadBox">
                📂 Drag & Drop OR Click
                <input type="file" name="file" id="fileInput" required>
                <div id="preview"></div>
            </div>

            <!-- BUTTON BELOW -->
            <button type="submit" class="upload-btn">🚀 Upload</button>

            <!-- PROGRESS BELOW -->
            <div class="progress" id="progress">
                <div class="progress-bar" id="bar"></div>
            </div>

        </form>

    </div>

    <!-- FILE LIST -->
    <div class="files">
        <h3>📁 Uploaded Files</h3>

        {% for file in files %}
        <div class="file-card">
            <span>{{ file.split('/')[-1] }}</span>
            <a href="{{ file }}" target="_blank">Open</a>
        </div>
        {% endfor %}
    </div>

</div>

<script>
const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");

// CLICK opens file picker
uploadBox.addEventListener("click", () => fileInput.click());

// PREVIEW
fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    const preview = document.getElementById("preview");

    if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = e => preview.innerHTML = `<img src="${e.target.result}">`;
        reader.readAsDataURL(file);
    } else {
        preview.innerHTML = `<p>${file.name}</p>`;
    }
});

// DRAG DROP
uploadBox.addEventListener("dragover", e => {
    e.preventDefault();
    uploadBox.style.background = "rgba(255,255,255,0.2)";
});

uploadBox.addEventListener("dragleave", () => {
    uploadBox.style.background = "transparent";
});

uploadBox.addEventListener("drop", e => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    fileInput.dispatchEvent(new Event('change'));
    uploadBox.style.background = "transparent";
});

// PROGRESS
function startProgress() {
    let bar = document.getElementById("bar");
    let progress = document.getElementById("progress");
    progress.style.display = "block";

    let width = 0;
    let interval = setInterval(() => {
        width += 10;
        bar.style.width = width + "%";
        if (width >= 100) clearInterval(interval);
    }, 200);
}
</script>

</body>
</html>
